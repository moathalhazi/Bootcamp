
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API Tester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            cursor: pointer;
        }

        pre {
            background: #222;
            color: #00ff88;
            padding: 15px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>HTTP REST API Tester</h2>

    <h3>Request Body (JSON)</h3>

    <textarea id="body">{
    "name": "Moath Khaled",
    "email": "moath@example.com",
    "role": "Junior Network Engineer",
    "skills": ["PHP", "Python", "Networking"]
}</textarea>

    <h3>HTTP Methods</h3>

    <button onclick="sendRequest('GET')">GET</button>
    <button onclick="sendRequest('POST')">POST</button>
    <button onclick="sendRequest('PUT')">PUT</button>
    <button onclick="sendRequest('DELETE')">DELETE</button>
    <button onclick="sendRequest('PATCH')">PATCH</button>

    <h3>API Response</h3>

    <pre id="result">Waiting for request...</pre>

</div>

<script>

async function sendRequest(method) {

    const result = document.getElementById("result");

    try {

        const options = {
            method: method,
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer test-token"
            }
        };

        if (method === "POST" || method === "PUT") {
            options.body = document.getElementById("body").value;
        }

        const response = await fetch("index.php", options);

        const data = await response.json();

        result.textContent =
            "HTTP Status: " + response.status +
            "\n\n" +
            JSON.stringify(data, null, 4);

    } catch (error) {

        result.textContent = "Error: " + error.message;

    }
}

</script>

</body>
</html>
